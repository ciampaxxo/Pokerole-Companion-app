<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diario della campagna</title>
<link rel="manifest" href="diario.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#18212b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Diario Pokérole">
<style>
:root{--bg:#eef1f4;--surface:#fff;--sunk:#f3f5f7;--ink:#18212b;--muted:#5d6a77;--line:#d9dfe5;--accent:#c4283c;
  --display:ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;--body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#11171d;--surface:#1a222b;--sunk:#141b22;--ink:#e7ecf1;--muted:#97a4b1;--line:#2b3641;--accent:#ff5a6e}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg) radial-gradient(color-mix(in srgb,var(--ink) 7%,transparent) 1px,transparent 1.4px) 0 0/18px 18px;color:var(--ink);font:16px/1.5 var(--body);-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 12px calc(16px + env(safe-area-inset-left));
  background:linear-gradient(180deg,var(--surface),color-mix(in srgb,var(--surface) 92%,var(--accent)));border-bottom:3px solid var(--accent)}
.ball{width:28px;height:28px;flex:none;border-radius:50%;border:2.5px solid var(--ink);background:linear-gradient(var(--accent) 0 44%,var(--ink) 44% 56%,#fff 56%);position:relative}
.ball::after{content:"";position:absolute;inset:50% auto auto 50%;width:8px;height:8px;margin:-6.5px 0 0 -6.5px;border-radius:50%;background:#fff;border:2.5px solid var(--ink)}
h1{margin:0;font:800 19px/1.1 var(--display);letter-spacing:.02em;text-transform:uppercase}
h1+small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
main{max-width:720px;margin:0 auto;padding:14px 16px calc(32px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 12px;font:600 13px/1 var(--display)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input,select,textarea{width:100%;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:160px;resize:vertical}label{display:block;font:700 11px/1.2 var(--display);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:10px 0 4px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 14px;font:700 15px/1 var(--display);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1}
.st{font:700 11px/1 var(--display);text-transform:uppercase;letter-spacing:.04em;padding:3px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}.st.on{color:var(--accent);border-color:var(--accent)}
.sent{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;z-index:60;display:none;max-width:90vw}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px -8px rgba(0,0,0,.18)}
.card h2{margin:4px 0 8px;font:700 18px/1.25 var(--display)}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.tag{font:700 11px/1 var(--display);text-transform:uppercase;letter-spacing:.05em;padding:4px 8px;border-radius:999px;background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:var(--accent)}
.md p{margin:0 0 8px}.md ul{margin:0 0 8px;padding-left:20px}.md :last-child{margin-bottom:0}
.muted{color:var(--muted)}.small{font-size:13px}
.empty{text-align:center;padding:30px 10px}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}.gal.one{grid-template-columns:1fr}
.gal figure{margin:0}.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;display:block;background:var(--sunk);cursor:zoom-in}
.gal.one img{aspect-ratio:auto;max-height:440px;object-fit:contain}.gal figcaption{font-size:12px;color:var(--muted);margin-top:3px}
.zoom{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center}.zoom img{max-width:100%;max-height:100%;object-fit:contain}
</style>
</head>
<body>
<header><span class="ball" aria-hidden="true"></span><div><h1>Diario della campagna</h1><small id="st">Caricamento...</small></div></header>
<main>
  <div class="card" id="nota"></div>
  <div class="seg" id="cats"></div>
  <input id="q" type="search" placeholder="Cerca nel diario" aria-label="Cerca nel diario">
  <div id="list" style="display:flex;flex-direction:column;gap:12px"></div>
</main>
<div id="toast" role="status"></div>
<script>
const REPO="ciampaxxo/Pokerole-Companion-app";
const CAT={ses:'Sessione',png:'Personaggi',luo:'Luoghi',mis:'Missioni',med:'Medaglie',not:'Note'};
const CK='diario-pokerole-cache';
let data=null,cat='',q='';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const key=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function md(s){const L=esc(s).split(/\n/);let h='',ul=false;L.forEach(l=>{const b=l.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');if(/^\s*[-•]\s+/.test(l)){if(!ul){h+='<ul>';ul=true}h+='<li>'+b.replace(/^\s*[-•]\s+/,'')+'</li>'}else{if(ul){h+='</ul>';ul=false}if(b.trim())h+='<p>'+b+'</p>'}});if(ul)h+='</ul>';return h}
function repo(){const h=location.hostname;if(/\.github\.io$/.test(h)){const seg=location.pathname.split('/').filter(Boolean)[0];if(seg&&!/\.html$/.test(seg))return h.split('.')[0]+'/'+seg}return REPO}
function gal(a){if(!a||!a.length)return '';return `<div class="gal${a.length===1?' one':''}">${a.map(im=>`<figure><img src="${esc('https://raw.githubusercontent.com/'+repo()+'/main/'+im.f)}" alt="${esc(im.d||'')}" loading="lazy" data-zoom="1">${im.d?`<figcaption>${esc(im.d)}</figcaption>`:''}</figure>`).join('')}</div>`}
document.addEventListener('click',e=>{const z=e.target.closest('[data-zoom]');if(z){const o=document.createElement('div');o.className='zoom';o.innerHTML=`<img src="${esc(z.src)}" alt="">`;o.addEventListener('click',()=>o.remove());document.body.appendChild(o)}});
function render(){
  const V=(data&&data.voci)||[];const used=[...new Set(V.map(v=>v.c))];
  document.getElementById('cats').innerHTML=used.length>1?`<button data-c="" aria-pressed="${!cat}">Tutto</button>`+Object.keys(CAT).filter(c=>used.includes(c)).map(c=>`<button data-c="${c}" aria-pressed="${cat===c}">${CAT[c]}</button>`).join(''):'';
  const k=key(q),L=V.filter(v=>(!cat||v.c===cat)&&(!k||key((v.t||'')+' '+(v.b||'')+' '+(v.w||'')).includes(k)));
  document.getElementById('list').innerHTML=L.length?L.map(v=>`<article class="card"><div class="meta"><span class="tag">${esc(CAT[v.c]||'Note')}</span>${v.w?`<span>${esc(v.w)}</span>`:''}${v.a?`<span>Scritta da <b>${esc(v.a)}</b></span>`:''}</div><h2>${esc(v.t||'')}</h2><div class="md">${md(v.b||'')}</div>${gal(v.img)}</article>`).join('')
    :`<div class="card empty muted">${V.length?'Nessuna voce corrisponde alla ricerca.':'Il master non ha ancora pubblicato nulla. Torna più tardi!'}</div>`;
}
function stamp(off){const st=document.getElementById('st');if(!data){st.textContent=off?'Non riesco a caricare il diario: serve internet la prima volta.':'Caricamento...';return}
  const d=data.aggiornato?new Date(data.aggiornato).toLocaleString('it-IT',{dateStyle:'medium',timeStyle:'short'}):'';st.textContent=(off?'Senza connessione · ':'')+(d?'Aggiornato il '+d:'')}
async function load(){
  try{const c=localStorage.getItem(CK);if(c){data=JSON.parse(c);render();stamp(false)}}catch(e){}
  let o=null;
  try{const r=await fetch('https://api.github.com/repos/'+repo()+'/contents/diario.json',{headers:{Accept:'application/vnd.github.raw+json'},cache:'no-store'});if(r.ok)o=await r.json()}catch(e){}
  if(!o){try{const r=await fetch('diario.json?t='+Date.now(),{cache:'no-store'});if(r.ok)o=await r.json()}catch(e){}}
  if(o){data=o;try{localStorage.setItem(CK,JSON.stringify(o))}catch(e){}render();stamp(false)}else{render();stamp(true)}
  nota()
}
/* note per il master: si mandano con un link in chat, il master le approva prima che entrino nel diario */
const PNK='diario-nota-bozza',PNS='diario-note-inviate';let nOpen=false,code=null,sig='';
const ls=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}},lset=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const uid=()=>Date.now().toString(36)+Math.floor(Math.random()*1e6).toString(36);
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}
const b64url=u=>{let b='';for(let i=0;i<u.length;i+=0x8000)b+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(b).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
async function pack(o){const raw=new TextEncoder().encode(JSON.stringify(o));if(window.CompressionStream){try{return 'z'+b64url(new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer()))}catch(e){}}return 'u'+b64url(raw)}
const appUrl=()=>location.protocol.startsWith('http')?location.origin+location.pathname.replace(/[^/]*$/,''):'https://'+REPO.split('/')[0]+'.github.io/'+REPO.split('/')[1]+'/';
function draft(){return Object.assign({a:'',t:'',c:'ses',b:''},ls(PNK,{}))}
function obj(){const n=draft();if(!n.id){n.id=uid();lset(PNK,n)}return {v:1,n:{id:n.id,t:n.t.trim(),c:n.c,b:n.b.trim(),a:n.a.trim(),at:Date.now()}}}
function prep(){const o=obj(),sg=JSON.stringify([o.n.id,o.n.t,o.n.c,o.n.b,o.n.a]);if(sg===sig)return;sig=sg;code=null;pack(o).then(c=>{if(sig===sg)code=c})}
function nota(){const el=document.getElementById('nota'),n=draft(),sent=ls(PNS,[]),pub=new Set(((data&&data.voci)||[]).map(v=>v.id));
  const when=t=>new Date(t).toLocaleString('it-IT',{dateStyle:'short',timeStyle:'short'});
  const list=sent.length?sent.slice(0,8).map(x=>`<div class="sent"><span class="grow">${esc(x.t||'Senza titolo')}<br><span class="small muted">inviata ${when(x.at)}</span></span><span class="st${pub.has(x.id)?' on':''}">${pub.has(x.id)?'Nel diario':'Al master'}</span></div>`).join(''):'';
  if(!nOpen){el.innerHTML=`<div class="row"><h2 class="grow" style="margin:0">Le tue note</h2><button class="btn pri" data-n="open">Scrivi una nota</button></div><p class="small muted">Racconta una scena, un luogo o un personaggio: la mandi al master, che decide se aggiungerla al diario con il tuo nome.</p>${list}`;return}
  prep();el.innerHTML=`<h2 style="margin:0">Nota per il master</h2>
  <label for="na">Il tuo nome</label><input id="na" data-f="a" value="${esc(n.a)}" maxlength="40" placeholder="Nome del giocatore o del personaggio">
  <label for="nt">Titolo</label><input id="nt" data-f="t" value="${esc(n.t)}" maxlength="120" placeholder="Es. La notte al faro">
  <label for="nc">Categoria</label><select id="nc" data-f="c">${Object.keys(CAT).map(c=>`<option value="${c}"${c===n.c?' selected':''}>${CAT[c]}</option>`).join('')}</select>
  <label for="nb">Testo</label><textarea id="nb" data-f="b" maxlength="4000" placeholder="Cosa è successo, cosa ha visto o pensato il tuo personaggio...">${esc(n.b)}</textarea>
  <p class="small muted">Puoi usare **grassetto** e righe che iniziano con - per gli elenchi. La bozza resta salvata su questo dispositivo.</p>
  <div class="row"><button class="btn grow" data-n="close">Chiudi</button><button class="btn pri grow" data-n="send">Invia al master</button></div>
  <p class="small muted">Si apre la condivisione: manda il messaggio al master in chat. Solo lui la vede finché non la approva.</p>`}
document.getElementById('nota').addEventListener('input',e=>{const f=e.target.dataset.f;if(!f)return;const n=draft();n[f]=e.target.value;lset(PNK,n);prep()});
document.getElementById('nota').addEventListener('click',async e=>{const b=e.target.closest('[data-n]');if(!b)return;const a=b.dataset.n;
  if(a==='open'||a==='close'){nOpen=a==='open';nota();return}
  const n=draft();if(!n.a.trim()){toast('Scrivi il tuo nome');return}if(!n.t.trim()&&!n.b.trim()){toast('Scrivi almeno un titolo o un testo');return}
  const o=obj(),c=code||await pack(o),url=appUrl()+'#imp='+c,text='Nota per il diario da '+n.a.trim()+': «'+(n.t.trim()||'senza titolo')+'». Master: apri il link, oppure incolla questo messaggio in Diario → Incolla una nota.';
  let ok=false;if(navigator.share){try{await navigator.share({title:'Nota per il diario',text,url});ok=true}catch(err){if(err&&err.name==='AbortError')return}}
  if(!ok){try{await navigator.clipboard.writeText(text+'\n'+url);toast('Copiato: incollalo nella chat con il master')}catch(err){prompt('Copia questo messaggio e mandalo al master:',text+'\n'+url)}}
  const L=ls(PNS,[]).filter(x=>x.id!==o.n.id);L.unshift({id:o.n.id,t:o.n.t,at:Date.now()});lset(PNS,L.slice(0,30));lset(PNK,{a:n.a,t:'',c:n.c,b:''});sig='';nOpen=false;nota()});
document.getElementById('cats').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;cat=b.dataset.c;render()});
document.getElementById('q').addEventListener('input',e=>{q=e.target.value;render()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')load()});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
nota();load();
</script>
</body>
</html>
