<title>Master Pokérole</title>
<style>
/* Layout: schermo da master a una colonna, barra in basso, schede a tutto schermo. I pallini delle statistiche riprendono il Pokédex del manuale. */
:root{
  --bg:#e9ecf0; --surface:#ffffff; --sunk:#f3f5f8; --ink:#141d27; --muted:#56636f; --line:#d3d9e0;
  --accent:#c4283c; --accent-ink:#ffffff; --add:#e2a61b; --good:#2f8f5b; --warn:#b3261e;
  --display:"Roboto Condensed","Avenir Next Condensed","Arial Narrow",sans-serif-condensed,system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e141a; --surface:#18212b; --sunk:#121a22; --ink:#e7ecf1; --muted:#94a2b0; --line:#2b3745;
    --accent:#f0596b; --accent-ink:#190a0d; --add:#f0bd3a; --good:#58c48a; --warn:#ff8a80; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e141a; --surface:#18212b; --sunk:#121a22; --ink:#e7ecf1; --muted:#94a2b0; --line:#2b3745;
  --accent:#f0596b; --accent-ink:#190a0d; --add:#f0bd3a; --good:#58c48a; --warn:#ff8a80; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
header.top{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{font:700 19px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;flex:1}
.brand b{color:var(--accent)}
.brand small{display:block;font:500 11px/1.3 var(--body);letter-spacing:.02em;text-transform:none;color:var(--muted);margin-top:3px}
main{flex:1;overflow-y:auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:12px}
nav.tabs{display:grid;grid-template-columns:repeat(6,1fr);background:var(--surface);border-top:1px solid var(--line)}
nav.tabs button{background:none;border:0;border-top:3px solid transparent;padding:10px 1px 12px;font:600 10.5px/1.1 var(--display);letter-spacing:0;text-transform:uppercase;color:var(--muted)}
nav.tabs button[aria-current="page"]{color:var(--ink);border-top-color:var(--accent)}
h2{font:700 15px/1.2 var(--display);letter-spacing:.08em;text-transform:uppercase;margin:0;text-wrap:balance}
h3{font:700 13px/1.2 var(--display);letter-spacing:.08em;text-transform:uppercase;margin:0;color:var(--muted)}
p{margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)} .small{font-size:13px} .num{font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;font-weight:600;min-height:40px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none}
.btn.sm{padding:5px 9px;min-height:32px;font-size:13px}
.btn.danger{color:var(--warn)}
.field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:120px}
.field label{font:600 11px/1 var(--display);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=search],input[type=number],input[type=password],select,textarea{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:40px}
textarea{min-height:76px;resize:vertical}
.chip{display:inline-flex;align-items:center;border-radius:999px;padding:2px 9px;font:700 11.5px/1.5 var(--display);letter-spacing:.05em;text-transform:uppercase;color:#fff;white-space:nowrap}
.chip.dark{color:#16202b}
.tag{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:12.5px;white-space:nowrap}
.pip{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--ink);display:inline-block;background:linear-gradient(var(--pc) 0 46%,var(--ink) 46% 56%,#fff 56%);flex:none}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;min-height:34px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item .t{font-weight:650}
.dexn{font:600 12px/1 var(--display);color:var(--muted);width:44px;flex:none}
.stats{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center}
.stats .lab{font:700 12px/1 var(--display);letter-spacing:.08em;text-transform:uppercase}
.dots{display:flex;gap:3px;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--muted);background:transparent}
.dot.b{background:var(--ink);border-color:var(--ink)}
.dot.a{background:var(--add);border-color:var(--add)}
.derived{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:6px}
.derived div{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:6px 4px;text-align:center}
.derived b{display:block;font:700 19px/1.1 var(--display)}
.derived span{font:600 10.5px/1.2 var(--display);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.kv{display:flex;flex-wrap:wrap;gap:6px}
.kv span{background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-size:12.5px}
.kv b{font-variant-numeric:tabular-nums}
.mv{border-top:1px solid var(--line);padding:8px 0 2px;display:flex;flex-direction:column;gap:4px}
.mv:first-of-type{border-top:0;padding-top:0}
.mv .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mv .n{font-weight:700;background:none;border:0;padding:0;text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.pool{font:700 12.5px/1.4 var(--display);letter-spacing:.03em}
.eff{font-size:13px;color:var(--muted)}
.step{display:inline-flex;align-items:center;gap:4px}
.step button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--sunk);font-weight:700}
.step b{min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 12px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:6px}
.sheet{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:10}
.sheet>.in{max-width:760px;width:100%;margin:0 auto;display:flex;flex-direction:column;height:100%}
.sheet header{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.sheet header h2{flex:1;font-size:16px}
.sheet .body{flex:1;overflow-y:auto;padding:14px 16px 28px;display:flex;flex-direction:column;gap:12px}
details.gl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.gl summary{padding:11px 12px;font-weight:700;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
details.gl summary small{font-weight:500;color:var(--muted);white-space:nowrap}
details.gl .gb{padding:0 12px 12px;display:flex;flex-direction:column;gap:8px;font-size:14px}
details.gl ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
table.t{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left}
table.t th{font:700 11px/1.2 var(--display);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.scroll{overflow-x:auto}
.note{font-size:12.5px;color:var(--muted);border-left:3px solid var(--line);padding-left:9px}
.fc{border-left:5px solid var(--sa);} .fc.B{border-left-color:var(--sb)} .fc.cur{outline:2px solid var(--accent);outline-offset:1px} .fc.ko{opacity:.55}
:root{--sa:#2f86c9;--sb:#c4283c}
.n6{display:flex;gap:4px}.n6 button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--sunk);font-weight:700}.n6 button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.big{font:700 22px/1.1 var(--display)}
.res{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--sunk);display:flex;flex-direction:column;gap:6px}
.ok{color:var(--good);font-weight:700}.no{color:var(--warn);font-weight:700}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;z-index:30}
.hp{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar{flex:1;min-width:90px;height:10px;border-radius:99px;background:var(--sunk);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good)}
/* sprite e decorazioni */
body{background:var(--bg) radial-gradient(color-mix(in srgb,var(--ink) 7%,transparent) 1px,transparent 1.4px) 0 0/18px 18px}
header.top{position:relative;background:linear-gradient(180deg,var(--surface),color-mix(in srgb,var(--surface) 92%,var(--accent)))}
header.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 30%,transparent))}
.ball{width:26px;height:26px;flex:none;border-radius:50%;border:2.5px solid var(--ink);background:linear-gradient(var(--accent) 0 44%,var(--ink) 44% 56%,#fff 56%);position:relative}
.ball::after{content:"";position:absolute;inset:50% auto auto 50%;width:8px;height:8px;margin:-6.5px 0 0 -6.5px;border-radius:50%;background:#fff;border:2.5px solid var(--ink)}
nav.tabs svg{display:block;width:22px;height:22px;margin:0 auto 3px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"] svg{color:var(--accent)}
.card{box-shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px -8px rgba(0,0,0,.18)}
.spr{image-rendering:pixelated;image-rendering:crisp-edges;object-fit:contain;display:block}
.av{--tc:#8a96a3;width:46px;height:46px;flex:none;border-radius:12px;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(ellipse 60% 22% at 50% 84%,color-mix(in srgb,var(--tc) 45%,transparent),transparent 100%),linear-gradient(160deg,color-mix(in srgb,var(--tc) 26%,var(--surface)),color-mix(in srgb,var(--tc) 8%,var(--surface)));
  border:1px solid color-mix(in srgb,var(--tc) 40%,var(--line))}
.av .spr{width:86%;height:86%}
.av.sm{width:36px;height:36px;border-radius:9px}
.av.tr .spr{width:94%;height:94%;object-position:50% 100%}
.av b{font:700 19px/1 var(--display);color:color-mix(in srgb,var(--tc) 75%,var(--ink));opacity:.8}
.strip{display:flex;gap:2px;flex:none}
.strip .spr{width:28px;height:28px}
.hero{--tc:#8a96a3;--tc2:var(--tc);position:relative;height:168px;margin:-12px -12px 0;border-radius:var(--r) var(--r) 0 0;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;
  background:linear-gradient(155deg,color-mix(in srgb,var(--tc) 70%,#fff) ,color-mix(in srgb,var(--tc2) 85%,#000 10%))}
.hero::before{content:"";position:absolute;right:-40px;top:-40px;width:190px;height:190px;border-radius:50%;border:22px solid rgba(255,255,255,.16);box-shadow:inset 0 0 0 0 transparent}
.hero::after{content:"";position:absolute;right:-40px;top:55px;width:190px;height:22px;background:rgba(255,255,255,.16)}
.hero .floor{position:absolute;left:50%;bottom:14px;width:170px;height:30px;margin-left:-85px;border-radius:50%;background:rgba(0,0,0,.18)}
.hero .spr{position:relative;z-index:1;margin-bottom:22px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.2))}
.hero.tr .spr{margin-bottom:6px}
.av .pic{width:100%;height:100%;object-fit:cover;display:block}
.hero .pic{position:relative;z-index:1;width:128px;height:128px;object-fit:cover;border-radius:50%;border:4px solid rgba(255,255,255,.9);margin-bottom:20px;box-shadow:0 6px 16px rgba(0,0,0,.25);cursor:zoom-in}
.pwsteps{display:flex;gap:4px;overflow-x:auto;margin:0 0 10px;padding-bottom:2px}
.pwsteps button{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;font:600 11px var(--body,inherit);color:var(--muted);padding:4px 6px;cursor:pointer}
.pwsteps b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--muted);font-size:12px}
.pwsteps .past b{background:color-mix(in srgb,var(--accent,#d33) 22%,transparent);color:var(--ink,#222)}
.pwsteps [aria-current=step]{color:var(--ink,#222)}.pwsteps [aria-current=step] b{background:var(--accent,#d33);color:#fff}
.pwimg{display:flex;gap:14px;align-items:center;margin-bottom:10px}
.pwimg .ph{width:84px;height:84px;flex:none;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:var(--sunk);font:700 34px/1 var(--display);color:var(--muted)}
.pwimg .ph img{width:100%;height:100%;object-fit:cover}
.pwimg h2{margin:0}
.pwopts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pwopts button{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:10px;border-radius:12px;border:1.5px solid var(--line);background:var(--card,#fff);cursor:pointer;font:inherit;color:inherit}
.pwopts button[aria-pressed=true]{border-color:var(--accent,#d33);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent,#d33) 25%,transparent)}
.pwl{font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--sunk);white-space:nowrap}
.pwl.done{background:#dff3e4;color:#1d6b35}.pwl.over{background:#fde2e2;color:#a01d1d}
.pwnav{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg,#f5f5f5) 30%);padding-top:14px}
.hero .ph{position:relative;z-index:1;font:700 64px/1 var(--display);color:rgba(255,255,255,.75);margin-bottom:40px}
.hero .badge{position:absolute;left:10px;top:10px;z-index:2;display:flex;gap:5px}
.team{display:flex;gap:6px;flex-wrap:wrap}
.team button{border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:4px;display:flex;flex-direction:column;align-items:center;gap:2px;width:64px;font:600 10.5px/1.1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.team button .av{width:52px;height:46px;border:0;background:none}
.team button span{max-width:58px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* giocatori, cattura, diario */
.money{font:700 15px/1 var(--display);color:var(--ink)}
.ent .snip{display:block;color:var(--muted);font-size:13px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:62vw}
.md p{margin:0 0 8px}.md ul{margin:0 0 8px;padding-left:18px}
.vis{font:600 11px/1 var(--display);text-transform:uppercase;letter-spacing:.04em;padding:3px 7px;border-radius:999px;background:var(--sunk);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.vis.on{background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.rwrow{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.rwrow:first-of-type{border-top:0}
textarea.tall{min-height:260px}
main>*,.sheet .body>*{flex-shrink:0}
.ach{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--line)}.ach:first-of-type{border-top:0}
.ach b.ck{width:22px;height:22px;flex:none;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:#fff}
.ach b.ck.on{background:var(--ok,#2f9e5b);border-color:var(--ok,#2f9e5b)}
.ach button{all:unset;cursor:pointer;display:flex;gap:8px;align-items:flex-start}
.prog{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;border:1px solid var(--line)}.prog i{display:block;height:100%;background:var(--accent)}
.mart .item{gap:10px}.mart .pr{font:700 14px/1 var(--display);white-space:nowrap}
/* schermo per il tavolo */
#tav{position:fixed;inset:0;z-index:60;background:#0b1015;color:#eef2f6;overflow:hidden;font-family:var(--body);display:flex;flex-direction:column}
#arena{position:relative;flex:1;overflow:hidden}
#arena svg.bg{position:absolute;inset:0;width:100%;height:100%}
#arena .mons{position:absolute;inset:0}
#arena .mon{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center}
#arena .mon .spr{image-rendering:pixelated;image-rendering:crisp-edges;position:relative;z-index:1;animation:idleB 2.6s ease-in-out infinite;transform-origin:50% 100%}
#arena .mon .spr.back{animation-duration:3.2s}
#arena .mon:nth-child(2n) .spr{animation-delay:-1.1s}
@keyframes idleB{50%{transform:translateY(-3%) scaleY(1.02)}}
#arena .mon .pf{position:absolute;bottom:-6%;left:50%;transform:translateX(-50%);aspect-ratio:4/1;border-radius:50%;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,.42),rgba(0,0,0,.18) 60%,transparent 72%)}
#arena .mon.cur .pf{background:radial-gradient(ellipse at 50% 50%,rgba(255,215,90,.75),rgba(255,190,40,.35) 55%,transparent 72%);animation:curP 1.2s ease-in-out infinite}
@keyframes curP{50%{filter:brightness(1.5)}}
#arena .mon.ko .spr{opacity:.25;filter:grayscale(1);animation:none;transform:translateY(25%) scaleY(.5)}
#arena .plate{position:relative;z-index:2;background:rgba(14,20,27,.82);border:2px solid rgba(255,255,255,.18);border-radius:10px;padding:4px 8px 5px;margin-bottom:4px;box-shadow:0 3px 10px rgba(0,0,0,.35)}
#arena .mon.A .plate{border-color:#4f86c6}#arena .mon.B .plate{border-color:#c6505f}
#arena .plate b{display:block;font:700 clamp(12px,1.7vw,17px)/1.1 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#arena .plate small{display:block;font-size:10.5px;color:#9fb0c0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#arena .plate em{display:block;font:700 11px/1 var(--display);font-style:normal;color:#dfe7ef;margin-top:3px;text-align:right}
#arena .hpb{height:8px;margin-top:4px;border-radius:99px;background:#05080b;overflow:hidden;border:1px solid #2f3d4a}#arena .hpb i{display:block;height:100%;transition:width .9s ease,background .9s}
#arena .sts{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}#arena .sts span{font:700 9.5px/1 var(--display);padding:3px 5px;border-radius:99px;background:#7a2533;color:#ffe1e5;text-transform:uppercase}

const STYLES=[['bal','Bilanciato',[1,1,1,1,1]],['phy','Fisico',[3,1.5,1.5,.4,1]],['spe','Speciale',[.4,1.5,1,3,1.8]],['def','Difensivo',[1,.6,3,1,3]],['spd','Veloce',[1.3,3.2,.8,1.3,1]]];
const HAB={prateria:{n:'Prateria',c:['Normal','Flying','Ground','Grass'],u:['Fight','Rock','Dark','Electric'],r:['Fire','Fairy','Psychic']},foresta:{n:'Foresta',c:['Bug','Grass','Poison','Flying'],u:['Fight','Electric','Normal','Rock'],r:['Ghost','Steel','Dark']}};
const CH={Normal:{n:['Rock','Steel'],i:['Ghost']},Fire:{s:['Grass','Ice','Bug','Steel'],n:['Fire','Water','Rock','Dragon']},Water:{s:['Fire','Ground','Rock'],n:['Water','Grass','Dragon']},Grass:{s:['Water','Ground','Rock'],n:['Fire','Grass','Poison','Flying','Bug','Dragon','Steel']},Electric:{s:['Water','Flying'],n:['Electric','Grass','Dragon'],i:['Ground']},Ice:{s:['Grass','Ground','Flying','Dragon'],n:['Fire','Water','Ice','Steel']},Fight:{s:['Normal','Ice','Rock','Dark','Steel'],n:['Poison','Flying','Psychic','Bug','Fairy'],i:['Ghost']},Poison:{s:['Grass','Fairy'],n:['Poison','Ground','Rock','Ghost'],i:['Steel']},Ground:{s:['Fire','Electric','Poison','Rock','Steel'],n:['Grass','Bug'],i:['Flying']},Flying:{s:['Grass','Fight','Bug'],n:['Electric','Rock','Steel']},Psychic:{s:['Fight','Poison'],n:['Psychic','Steel'],i:['Dark']},Bug:{s:['Grass','Psychic','Dark'],n:['Fire','Fight','Poison','Flying','Ghost','Steel','Fairy']},Rock:{s:['Fire','Ice','Flying','Bug'],n:['Fight','Ground','Steel']},Ghost:{s:['Psychic','Ghost'],n:['Dark'],i:['Normal']},Dragon:{s:['Dragon'],n:['Steel'],i:['Fairy']},Dark:{s:['Psychic','Ghost'],n:['Fight','Dark','Fairy']},Steel:{s:['Ice','Rock','Fairy'],n:['Fire','Water','Electric','Steel']},Fairy:{s:['Fight','Dragon','Dark'],n:['Fire','Poison','Steel']}};
const FIX={dextrity:'Dexterity',dexerity:'Dexterity',inisight:'Insight',inisght:'Insight',stength:'Strength',strangth:'Strength',etiqutte:'Etiquette',ettiquete:'Etiquette'};
const key=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,'');
const ABI={};AB.forEach((a,i)=>ABI[key(a.n)]=i);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const rint=n=>Math.floor(Math.random()*n);
const pick=a=>a[rint(a.length)];
const uid=()=>Date.now().toString(36)+rint(1e6).toString(36);
function wpick(items,wf){let tot=0;const ws=items.map(x=>{const w=Math.max(0,wf(x));tot+=w;return w});if(tot<=0)return items.length?pick(items):null;let r=Math.random()*tot;for(let i=0;i<items.length;i++){r-=ws[i];if(r<0)return items[i]}return items[items.length-1]}

/* ---------- stato ---------- */
const SKEY='master-pokerole-v1';
let mem=null;
function load(){try{const t=localStorage.getItem(SKEY);if(t)return JSON.parse(t)}catch(e){}return mem}
let svT=0;function saveSoon(){clearTimeout(svT);svT=setTimeout(save,400)}

let S=load()||null;
const ui={bt:{side:'A',src:'saved',q:'',rk:-1,open:null},act:null,ga:{a:-1,rk:-1,n:0},di:{q:'',c:''},dp:{q:'',c:''},gr:{fg:null,q:''},dx:{f:'s',q:''},mart:{to:null,q:{}},dmode:'edit',tv:'pg',tab:'genera',gen:{mode:'mon',n:1,batch:[],sel:0,q:'',mi:null,rk:null,style:'bal',f:{type:'',reg:'',stage:'',hab:'',rare:false,low:false},cur:null,target:'saved'},gi:{cat:'',max:'',n:3,rare:false,res:[]},db:{kind:'mon',q:'',type:'',cat:'',lim:50},gl:{q:'',d1:'',d2:''},stack:[],arm:null};

/* ---------- regole di calcolo ---------- */
function mvOf(ref){return typeof ref==='number'?MV[ref]:null}
function mvName(ref){return typeof ref==='number'?MV[ref].n:ref}
function tokVal(tok,P,d){
  let t=tok.replace(/[.*]/g,'').replace(/^D\s+|\s+D$/g,'').trim();t=FIX[t.toLowerCase()]||t;
  let i=ATTR.indexOf(t);if(i>=0)return {v:P.at[i],sk:false};
  i=SOC.indexOf(t);if(i>=0)return {v:P.so[i],sk:false};
  if(t in P.sk)return {v:P.sk[t],sk:true};
  if(t==='Will')return {v:d.will,sk:false};
  if(TSK.includes(t)||PSK.includes(t))return {v:0,sk:true};
  return null;
}
function accPool(mv,P,d){
  if(!mv||!mv.a||/same|varies/i.test(mv.a))return null;
  let tot=0,skill=false;
  for(const term of mv.a.split('+')){let best=null;for(const o of term.split('/')){const r=tokVal(o,P,d);if(r&&(best===null||r.v>best.v))best=r}if(best===null)return null;tot+=best.v;skill=skill||best.sk}
  if(skill&&P.rk===6)tot+=2;
  return tot;
}
function dmgPool(mv,P,M){
  if(!mv||mv.c==='Support')return null;
  let s=mv.d.replace(/Stength|Strangth/g,'Strength');
  const m=s.match(/(Strength|Special|Vitality|Dexterity)(?:\s*\/\s*(Strength|Special|Dexterity))?[\s*]*\+\s*(\d+)/);
  if(!m||/Target|Copied/i.test(s))return null;
  let a=P.at[ATTR.indexOf(m[1])];if(m[2])a=Math.max(a,P.at[ATTR.indexOf(m[2])]);
  const stab=M.ty.includes(mv.t);
  return {n:a+(+m[3])+(stab?1:0),stab};
}
function derive(P){
  const M=MON[P.m],b=P.rk===6?3:0,o=(S.opt&&S.opt.def)||2;
  const d={hp:M.hp+P.at[2]+b,will:P.at[4]+3+b,def:P.at[2]+b,sdef:(o===1?P.at[2]:P.at[4])+b,init:P.at[1]+(P.sk.Alert||0)+b};
  const sb=P.rk===6?2:0;
  d.eva=P.at[1]+(P.sk.Evasion||0)+sb;d.clash=Math.max(P.at[0],P.at[3])+(P.sk.Clash||0)+sb;
  return d;
}
function generate(mi,rk,style){
  const M=MON[mi],R=RKPTS[rk],W=(STYLES.find(s=>s[0]===style)||STYLES[0])[2];
  const at=M.st.map(s=>s[0]),cap=M.st.map(s=>s[1]+(rk===7?2:0));
  let pts=R.a,left=0;
  while(pts>0){const idx=[0,1,2,3,4].filter(i=>at[i]<cap[i]);if(!idx.length){left=pts;break}const i=wpick(idx,i=>W[i]*(1+(cap[i]-at[i])*.15));at[i]++;pts--}
  const so=[1,1,1,1,1];pts=R.s;
  while(pts>0){const idx=[0,1,2,3,4].filter(i=>so[i]<5);if(!idx.length)break;so[pick(idx)]++;pts--}
  const pool=M.mv.filter(x=>x[0]<=rk),n=Math.min(at[4]+3,pool.length);
  const isDmg=x=>{const mv=mvOf(x[1]);return !!mv&&mv.c!=='Support'};
  let sel=pool.map(x=>{const mv=mvOf(x[1]);let s=(.25+Math.random())*(1+.4*x[0]);
    if(mv){if(mv.c!=='Support'){if(M.ty.includes(mv.t))s*=1.7;if(style==='phy'&&/Physical/.test(mv.c))s*=1.6;if(style==='spe'&&/Special/.test(mv.c))s*=1.6;const us=/Strength/.test(mv.d);if((us?at[0]:at[3])>(us?at[3]:at[0]))s*=1.3}else s*=.75}else s*=.5;return [s,x]})
    .sort((a,b)=>b[0]-a[0]).slice(0,n).map(y=>y[1]);
  if(sel.length&&!sel.some(isDmg)){const dm=pool.filter(isDmg);if(dm.length)sel[sel.length-1]=dm[dm.length-1]}
  sel.sort((a,b)=>a[0]-b[0]);

function archPool(A,R){
  const sig=new Set(A[3]),ty=A[2],any=A[11];
  const fams=new Set();if(!A[12])MON.forEach(m=>{if(sig.has(m.n))m.fam.forEach(f=>fams.add(f))});
  const ok=m=>!(m.sg==='Unknown'||m.sg==='Mega Evolution'||m.sg==='Battle Bond Form'||m.rk>=6||m.rk==null);
  let c=[];MON.forEach((m,i)=>{if(!ok(m))return;let w=0;if(sig.has(m.n))w=4;else if(!A[12]&&m.num&&fams.has(m.num)&&!/\(/.test(m.n))w=3;else if(any||m.ty.some(t=>ty.includes(t)))w=1;if(w)c.push([i,w])});
  const fit=x=>{const d=R-MON[x[0]].rk;return d<0?0:d<=1?3:d===2?1:.25};
  let f=c.filter(x=>fit(x)>0);if(!f.length){const lo=Math.min(...c.map(x=>MON[x[0]].rk));f=c.filter(x=>MON[x[0]].rk===lo);return f.map(x=>[x[0],x[1]])}
  return f.map(x=>[x[0],x[1]*fit(x)]);
}
function genTrainer(ai,rk,nn){
  if(ai<0)ai=rint(ARCH.length);const A=ARCH[ai],fem=Math.random()<.5,R=RKPTS[rk];
  const t=newTrainer();t.rk=rk;t.age=pick(A[4]);t.role=fem?A[1]:A[0];t.spr=(ARCHSPR[ai]||['',''])[fem?1:0];
  t.name=A[10]===2||/^Gemell/.test(A[0])?(fem?pick(NF)+' e '+pick(NF):pick(NM)+' e '+pick(NM)):(fem?pick(NF):pick(NM));
  let pts=AGES[t.age][2]+R.a;while(pts>0){const o=[0,1,2,3].filter(i=>t.at[i]<5);if(!o.length)break;t.at[wpick(o,i=>A[5][i])]++;pts--}
  pts=AGES[t.age][3]+R.s;while(pts>0){const o=[0,1,2,3,4].filter(i=>t.so[i]<5);if(!o.length)break;t.so[pick(o)]++;pts--}
  pts=R.k;while(pts>0){const o=TSK.filter(k=>t.sk[k]<R.l);if(!o.length)break;t.sk[wpick(o,k=>A[6].includes(k)?4:k==='Throw'||k==='Alert'||k==='Evasion'?1:.35)]++;pts--}
  let n=nn>0?nn:A[10]||Math.max(1,Math.min(6,[1,2,3,3,4,5,6,6][rk]+A[7]+(Math.random()<.35?1:0)-(Math.random()<.3?1:0)));
  let pool=archPool(A,rk);const used=new Set();
  for(let k=0;k<n&&pool.length;k++){
    let p=pool.filter(x=>!used.has(MON[x[0]].num||x[0]));if(!p.length)p=pool;
    const x=wpick(p,y=>y[1]);used.add(MON[x[0]].num||x[0]);

function findInst(id,owner){
  if(owner==='battle'||owner==='saved'){const arr=owner==='battle'?((S.battle&&S.battle.wild)||[]):S.saved;return {arr,P:arr.find(p=>p.id===id)}}
  const t=S.trainers.find(x=>x.id===owner)||{team:[],box:[]};let arr=t.team,P=arr.find(p=>p.id===id);
  if(!P&&t.box){arr=t.box;P=arr.find(p=>p.id===id)}return {arr,P,t}}
const PERS=['b1','b2','b3','par','psn','tox','frz','slp'];
const BALLS=[['poke','Poké Ball',4],['mega','Mega Ball',6],['ultra','Ultra Ball',8],['spec','Ball speciale',9],['master','Master Ball',0]];
const CATCHREQ=[3,4,6,8,9,10,11,12];
const pgs=()=>S.trainers.filter(t=>t.pg);
const isPg=o=>{const t=S.trainers.find(x=>x.id===o);return !!(t&&t.pg)};
const money=n=>(+n||0).toLocaleString('it-IT')+' ₽';

function parseMoney(s){const m=String(s||'').match(/\d[\d.]*/);return m?parseInt(m[0].replace(/\./g,''),10)||0:0}
function md(s){const L=esc(s).split(/\n/);let h='',ul=false;L.forEach(l=>{const b=l.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');if(/^\s*[-•]\s+/.test(l)){if(!ul){h+='<ul>';ul=true}h+='<li>'+b.replace(/^\s*[-•]\s+/,'')+'</li>'}else{if(ul){h+='</ul>';ul=false}if(b.trim())h+='<p>'+b+'</p>'}});if(ul)h+='</ul>';return h}

  return `<div class="card"><h3>Legame e allenamento</h3><div class="grid2"><div class="srow"><span>Amicizia</span>${stepper('ibond','hap',P.hap||0)}</div><div class="srow"><span>Lealtà</span>${stepper('ibond','loy',P.loy||0)}</div><div class="srow"><span>Punti allenamento</span>${stepper('ibond','tp',P.tp||0)}</div></div>

/* ---------- crescita dei Pokémon (manuale pp. 106-112) ---------- */
const RKUP=[5,15,25,30,35,40,50],RETR=[1,10,20,25,30,35,40,45],EVT={Fast:10,Medium:30,Slow:50},EVTIT={Fast:'veloce',Medium:'media',Slow:'lenta'};
const stg=M=>M.sg==='First'?0:M.sg==='Second'?1:2;
const MVCOST=[[2,1],[4,2],[6,3]],OVRC=[5,15,20];
const allMons=t=>t.team.concat(t.box||[]);
function evoCands(mi){const M=MON[mi];if(!M.fam||!M.fam.length||stg(M)===2)return [];const k=M.fam.indexOf(M.num);if(k<0)return [];
  const want=stg(M)+1,later=M.fam.slice(k+1);const out=[];
  MON.forEach((X,i)=>{if(later.includes(X.num)&&!/Mega|Gigantamax|Primal/.test(X.sg+' '+X.n)&&(stg(X)===want||(want===1&&stg(X)===2&&!MON.some(Y=>later.includes(Y.num)&&stg(Y)===1))))out.push(i)});
  const seen=new Set();return out.filter(i=>{const n=MON[i].num+MON[i].n;if(seen.has(n))return false;seen.add(n);return true})}
function autoPoints(P,r0,r1){const M=MON[P.m],A=RKPTS[r1],B=RKPTS[r0];let a=A.a-B.a,so=A.s-B.s,k=A.k-B.k;const cap=M.st.map(x=>x[1]+(r1===7?2:0));
  while(a>0){const idx=[0,1,2,3,4].filter(i=>P.at[i]<cap[i]);if(!idx.length)break;P.at[wpick(idx,i=>1+P.at[i])]++;a--}
  while(so>0){const idx=[0,1,2,3,4].filter(i=>P.so[i]<5);if(!idx.length)break;P.so[pick(idx)]++;so--}
  while(k>0){const o=PSK.filter(x=>(P.sk[x]||0)<A.l);if(!o.length)break;const x=wpick(o,x=>1+3*(P.sk[x]||0));P.sk[x]=(P.sk[x]||0)+1;k--}}
function sGrow(top){const g=findInst(top.i,top.o),P=g.P,t=g.t;if(!P||!t)return '<p class="muted">Pokémon non trovato.</p>';const M=MON[P.m],st=stg(M),tp=P.tp||0,lim=P.at[4]+3,G=ui.gr;

  // rango

  if(!ev.length)h+=`<p class="small muted">${st===2?'È allo stadio finale.':'Nessuna evoluzione nota nel database.'}${M.ev?' '+esc(M.ev.replace(/^Evol\w+:\s*/,'Metodo: ')):''}</p>`;
  else{h+=ec?`<p>Tempo di evoluzione <b>${EVTIT[M.et]}</b>: costo <b>${ec}</b> punti.</p>`:`<p>${esc((M.ev||'Metodo speciale').replace(/^Evol\w+:\s*/,'Metodo: '))}. Nessun costo in punti: decidi tu quando succede.</p>`;

  ${learn.length?`<div class="seg">${learn.map(x=>{const c=costOf(x);return `<button data-a="glearn" data-i="${esc(x[1])}" data-n="${c}"${tp<c?' disabled style="opacity:.45"':''}><i class="pip" style="--pc:${RKCOL[x[0]]}"></i>${esc(mvName(x[1]))} · ${c}</button>`}).join('')}</div>`:'<p class="small muted">Conosce già tutte le mosse del suo rango.</p>'}
  <p class="small muted">Costo quando è al limite: mossa del rango attuale ${MVCOST[st][0]}, di rango inferiore ${MVCOST[st][1]}.</p>
  <h3>Con MT o DT · 5 punti</h3><div class="field"><input type="search" data-i="gtmq" value="${esc(G.q)}" placeholder="Cerca una mossa qualsiasi" autocomplete="off"></div><div id="gtml">${tmList(P)}</div></div>`;

function tmList(P){const q=key(ui.gr.q);if(q.length<2)return '';const r=[];for(let i=0;i<MV.length&&r.length<8;i++)if(key(MV[i].n).includes(q)&&!P.mv.some(x=>String(x)===String(i)))r.push(i);

  const r=defMul(types.filter(Boolean));const g=(f,l)=>{const t=TY.filter(a=>r[a]===f);return t.length?`<div class="row"><span class="small" style="min-width:128px"><b>${l}</b></span>${t.map(tchip).join('')}</div>`:''};
  return `<div style="display:flex;flex-direction:column;gap:5px">${g(2,'+2 danni')}${g(1,'+1 danno')}${g(-1,'−1 danno')}${g(-2,'−2 danni')}${g('i','Immune')}</div>`;
}
const rankTable=`<div class="scroll"><table class="t"><tr><th>Rango</th><th>Attr.</th><th>Social</th><th>Skill</th><th>Limite</th><th>Bersagli</th></tr>${RK.map((r,i)=>`<tr><td>${r}</td><td>${RKPTS[i].a}</td><td>${RKPTS[i].s}</td><td>${RKPTS[i].k}</td><td>${RKPTS[i].l}</td><td>${RKPTS[i].t}</td></tr>`).join('')}</table></div>`;
const GL=[
['Tiri di dado','p. 35',`<ul><li>Si tirano d6: ogni 4, 5 o 6 è un successo.</li><li>Un’azione usa quasi sempre <b>Attribute + Skill</b>: la somma dei punti è il numero di dadi.</li><li>Difficoltà fuori dal combattimento: da 1 successo (fastidio) a 5 o più (quasi impossibile); 3 è già un compito duro.</li><li><b>Fallimento critico:</b> 3 successi in meno di quelli richiesti. Succede qualcosa di brutto a scelta del master.</li></ul>`],
['HP, Will, difese e iniziativa','p. 26–28, 56',`<ul><li><b>HP</b> = Base HP della specie + Vitality. Gli umani hanno Base HP 4.</li><li><b>Will</b> = Insight + 3.</li><li><b>Defense</b> = Vitality. <b>Sp. Defense</b> = Insight, oppure Vitality se usate l’opzione semplice: si sceglie una volta per tutta la campagna (cambiala in Opzioni).</li><li><b>Iniziativa</b> = Dexterity + Alert, più il risultato di 1d6 a inizio scontro. In caso di parità agisce prima chi ha il punteggio base più alto.</li><li>Un Pokémon conosce al massimo <b>Insight + 3</b> mosse, scelte dal suo rango o da ranghi inferiori.</li></ul>`],
['Will Points','p. 28',`<ul><li><b>Resistere al dolore:</b> 1 punto ignora 1 penalità di dolore per la scena, fino a 3.</li><li><b>Tentare la sorte:</b> 1 punto fa ritirare un dado fallito in ogni tiro d’azione del round.</li><li><b>Forzare il destino:</b> 1 punto dà 1 successo automatico a un tiro, esclusi danni e Chance Dice.</li><li>Gli ultimi due non si usano nello stesso round. Chi spende tutti i punti sviene a fine scena.</li><li>Si recuperano con riposo, vittorie, obiettivi raggiunti, allenamento o buon gioco di ruolo.</li></ul>`],
['Ranghi e punti','p. 30–31, 41',`<p>I punti sono totali per quel rango e si sommano alle statistiche base della specie. Per gli umani si aggiungono i punti dell’età.</p>${rankTable}<ul><li><b>Master:</b> +2 dadi ai tiri che usano una Skill; HP, Will, iniziativa base e difese aumentano di 3.</li><li><b>Champion:</b> gli attributi possono superare il limite di 2 punti.</li><li>Un Pokémon non può essere addestrato oltre il rango del suo allenatore.</li></ul>`],
['Round e azioni','p. 56–58',`<ul><li>Ognuno agisce in ordine di iniziativa; quando tutti hanno agito chi ha ancora azioni può farne un’altra.</li><li>Fino a <b>5 azioni per round</b>. Ogni mossa o manovra si usa una sola volta per round.</li><li><b>Azioni multiple:</b> la 1ª azione richiede 1 successo, la 2ª 2, la 3ª 3, la 4ª 4, la 5ª 5.</li><li>Le reazioni si fanno nel turno altrui e consumano una delle proprie azioni.</li></ul>`],
['Precisione e danno','p. 57, 60–61, 79',`<ul><li><b>Precisione:</b> tira il pool indicato dalla mossa; servono i successi richiesti dal numero dell’azione.</li><li><b>Low Accuracy N</b> toglie N successi dal tiro.</li><li><b>Danno:</b> attributo + Power della mossa, meno la difesa del bersaglio (Defense per le mosse fisiche, Sp. Defense per le speciali). Si tira sempre almeno 1 dado.</li><li><b>STAB:</b> +1 dado se la mossa è dello stesso tipo del Pokémon.</li><li>Ogni successo è 1 danno. Una mossa a segno infligge sempre almeno 1 danno, anche senza successi: al tuo tavolo vale anche contro le resistenze (il manuale a p. 61 ammette che resistenze e scudi possano azzerarlo; si cambia in Opzioni).</li><li><b>Critico:</b> 3 successi oltre quelli richiesti nel tiro di precisione danno +2 dadi al danno. Con High Critical ne bastano 2.</li><li><b>Set Damage</b> non si tira, ignora le difese e non prende bonus.</li></ul>`],
['Efficacia dei tipi','p. 52–53',`<ul><li>Superefficace: <b>+1 danno</b> al totale. Serve almeno 1 successo nel tiro di danno.</li><li>Poco efficace: <b>−1 danno</b>.</li><li>Doppio tipo, entrambi deboli: <b>+2</b>. Entrambi resistenti: <b>−2</b>.</li><li>Immunità: nessun danno.</li></ul><div id="tc"></div>`],
['Dolore e svenimento','p. 61–63',`<ul><li>A <b>metà HP</b> (arrotondati per difetto): 1 successo rimosso dai tiri. A <b>1 HP</b>: 2 successi rimossi.</li><li>Vale per precisione, danno, attributi sociali, Strength, Dexterity, Special e Insight. Non per Vitality e Will.</li><li>A 0 HP si sviene, in media per 8 ore. Si guarisce da soli 1 danno ogni 8 ore.</li><li>Il danno letale è una regola opzionale: dopo lo svenimento il danno diventa letale e, se raggiunge gli HP totali, il personaggio muore.</li></ul>`],
['Clash ed Evasion','p. 68–71',`<ul><li>Sono manovre di reazione, non subiscono la tabella delle azioni multiple ma consumano un’azione anche se falliscono.</li><li><b>Evasion:</b> Dexterity + Evasion. Se i successi pareggiano o superano quelli dell’attacco, nessun danno.</li><li><b>Clash:</b> Strength o Special + Clash, usando una propria mossa fisica o speciale. Se riesce, entrambi subiscono 1 danno, modificato da debolezze e resistenze, e gli effetti aggiuntivi non si attivano. Conta come uso di quella mossa nel round.</li><li>Niente Clash contro mosse Support, a danno fisso, che usano un attributo sociale per la precisione o che colpiscono il campo. Una mossa ad area si contrasta solo con un’altra mossa ad area.</li><li>Chi è in Flinch non può reagire.</li></ul>`],
['Stati alterati','p. 84–87',`<ul><li><b>Burn 1°:</b> 1 danno a fine round. <b>2°:</b> 2 danni letali. <b>3°:</b> 3 danni letali, +2 a ogni round che passa. Tipo Fuoco immune. Cura: Dexterity + Athletic nel proprio turno, sommando i successi fino a 4, 6 o 8.</li><li><b>Paralysis:</b> −2 Dexterity per 12 ore. Tipo Elettro immune.</li><li><b>Poison:</b> 2 danni a fine round. <b>Badly Poisoned:</b> 2 danni letali, +2 a ogni round che passa. Veleno e Acciaio immuni.</li><li><b>Frozen Solid:</b> nessuna azione. Il blocco ha 5 HP e difese 2; una mossa superefficace contro il Ghiaccio lo rompe subito. Tipo Ghiaccio immune.</li><li><b>Sleep:</b> nessuna azione. A inizio turno tira Insight: servono 5 successi per svegliarsi.</li><li><b>Confusion:</b> rimuove successi dai tiri in base al rango. A inizio round tira Insight: con 2 o più successi agisci normalmente. Se un’azione fallisce subisci 1 danno.</li><li><b>Flinch:</b> perdi l’azione del prossimo turno e non puoi reagire fino ad allora. Uno solo per round.</li><li><b>Disable:</b> una mossa non può essere usata. <b>In-Love:</b> vedi p. 87.</li><li>Gli stati si sommano tra loro. Aggravating peggiora, Fixed resta finché non lo curi, Volatile passa da solo o con il cambio.</li></ul>`],
['Meteo','p. 88–90',`<ul><li><b>Sunny:</b> mosse Fuoco +1 dado; mosse Acqua −1 danno totale; nessuno viene congelato.</li><li><b>Rain:</b> mosse Acqua +1 dado; mosse Fuoco −1 danno; niente ustioni di 2° e 3° grado.</li><li><b>Sandstorm:</b> 1 danno a fine round a chi non è Roccia, Terra o Acciaio; Sp. Defense +1 ai tipi Roccia.</li><li><b>Snow:</b> mosse Ghiaccio +1 dado; Defense +1 ai tipi Ghiaccio; +1 Chance Die per congelare.</li><li><b>Hail:</b> 1 danno a fine round a chi non è Ghiaccio; +1 Chance Die per congelare.</li><li><b>Desolate:</b> mosse Fuoco +2 dadi; le mosse Acqua falliscono.</li><li>Se due mosse cambiano il meteo vale l’ultima; tra due Ability si tira Will.</li></ul>`],
['Catturare un Pokémon','p. 98–100',`<div class="scroll"><table class="t"><tr><th>Rango selvatico</th><td>Starter</td><td>Rookie</td><td>Standard</td><td>Advanced</td><td>Expert</td><td>Ace</td></tr><tr><th>Successi</th><td>3</td><td>4</td><td>6</td><td>8</td><td>9</td><td>10</td></tr></table></div><ul><li><b>Bonus:</b> +1 se è a metà HP, +2 se è a 1 HP, +1 per ogni stato alterato. Contro un Pokémon svenuto i bonus si perdono.</li><li><b>Lancio:</b> Dexterity o Strength + Throw, e costa un’azione dell’allenatore.</li><li><b>Sigillo:</b> Poké Ball 4 dadi, Great Ball 6, Ultra Ball 8.</li><li>Con 3 successi in meno del necessario il Pokémon si libera e la Ball si rompe.</li></ul>`],
['Addestramento ed evoluzione','p. 104–111',`<div class="scroll"><table class="t"><tr><th>Passaggio</th><td>Rookie</td><td>Standard</td><td>Advanced</td><td>Expert</td><td>Ace</td><td>Master</td><td>Champion</td></tr><tr><th>Training Points</th><td>5</td><td>15</td><td>25</td><td>30</td><td>35</td><td>40</td><td>50</td></tr></table></div><ul><li>I Training Points si ottengono da lotte, sessioni di allenamento di circa 2 ore e gioco di ruolo.</li><li>Finché ha spazio, un Pokémon impara gratis le mosse del nuovo rango. Per cambiarne una: primo stadio 2 punti (1 se del rango precedente), secondo stadio 4 (2), stadio finale 6 (3).</li><li>Il tempo di evoluzione della specie (rapido, medio, lento) indica quanti punti servono; il master può anticipare o ritardare l’evoluzione per la storia.</li></ul>`],
['Creare allenatori e PNG','p. 40–44, 589',`<ul><li>Umani: ogni attributo e attributo sociale parte da 1, limite 5.</li><li>Punti per età (attributi/social): Bambino 0/0, Adolescente 2/2, Adulto 4/4, Anziano 3/6. Si sommano a quelli del rango.</li><li>Per i Pokémon di un PNG: prendi la voce del Pokédex, assegna un rango (di solito quello dell’allenatore) e aggiungi i punti. È quello che fa il generatore.</li><li>Un allenatore porta con sé fino a 6 Pokémon.</li></ul>`]
];
function tcH(){const g=ui.gl;return `<div class="row">${selectH('d1','gd:d1',g.d1,[['','Tipo difensore']].concat(TY.map(t=>[t,TYIT[t]])),'Calcola debolezze')}${selectH('d2','gd:d2',g.d2,[['','Secondo tipo']].concat(TY.map(t=>[t,TYIT[t]])),'Secondo tipo')}</div>${g.d1?defH([g.d1,g.d2]):'<p class="small muted">Scegli un tipo per vedere cosa lo colpisce di più.</p>'}`}
function glList(){const k=key(ui.gl.q);const r=GL.filter(x=>!k||key(x[0]+x[2].replace(/<[^>]+>/g,' ')).includes(k));return r.length?r.map(x=>`<details class="gl"${k||x[0]==='Efficacia dei tipi'?' open':''}><summary><span>${x[0]}</span><small>${x[1]}</small></summary><div class="gb">${x[2]}</div></details>`).join(''):'<p class="muted">Nessuna regola trovata.</p>'}
function vGl(){return `<h2>Regole essenziali</h2><div class="row"><div class="field"><label for="glq">Cerca nel glossario</label><input id="glq" type="search" data-i="glq" value="${esc(ui.gl.q)}" placeholder="Es. critico, cattura, veleno" autocomplete="off"></div></div><div id="gll" style="display:flex;flex-direction:column;gap:8px">${glList()}</div><p class="note">Riassunti scritti per il tavolo: per i casi limite vale il manuale alle pagine indicate.</p>`}


/* ---------- assistente di battaglia ---------- */
const STATI=[['b1','Burn 1°'],['b2','Burn 2°'],['b3','Burn 3°'],['par','Paralysis'],['psn','Poison'],['tox','Badly Poisoned'],['frz','Frozen'],['slp','Sleep'],['cnf','Confusion'],['fln','Flinch'],['dis','Disable'],['lov','In-Love']];
const METEO=[['','Sereno'],['sun','Sunny'],['rain','Rain'],['sand','Sandstorm'],['snow','Snow'],['hail','Hail'],['des','Desolate']];
const MODL=['Str','Dex','Vit','Spe','Ins','Def','Sp.Def'];
const B=()=>S.battle;
function bNew(){S.battle={phase:'setup',round:1,ptr:0,weather:'',f:[],wild:[],log:[]};save()}
function bF(id){return B().f.find(x=>x.id===id)}
function bP(f){return findInst(f.i,f.o).P}
function bOwner(f){if(f.o==='battle')return 'selvatico';if(f.o==='saved')return 'salvato';const t=S.trainers.find(x=>x.id===f.o);return t?(t.name||'allenatore'):''}
function bName(f){const P=bP(f);if(!P)return '?';const n=P.nick||MON[P.m].n;const same=B().f.filter(x=>{const Q=bP(x);return Q&&(Q.nick||MON[Q.m].n)===n});return same.length>1?n+' '+(same.indexOf(f)+1):n}
function bAdd(o,i,side){const b=B();if(b.f.some(x=>x.o===o&&x.i===i))return;const P=findInst(i,o).P;b.f.push({id:uid(),side,o,i,d6:0,acts:0,used:[],st:((P&&P.st)||[]).slice(),mod:[0,0,0,0,0,0,0]})}
function bEff(f){const P=bP(f),Q=Object.assign({},P,{at:P.at.map((v,k)=>Math.max(0,v+(f.mod[k]||0)))});if(f.st.includes('par'))Q.at[1]=Math.max(0,Q.at[1]-2);return Q}
function bDer(f){const Q=bEff(f),M=MON[Q.m],d=derive(Q),P=bP(f),w=B().weather;d.hp=derive(P).hp;d.will=derive(P).will;d.def+=f.mod[5]||0;d.sdef+=f.mod[6]||0;if(w==='snow'&&M.ty.includes('Ice'))d.def++;if(w==='sand'&&M.ty.includes('Rock'))d.sdef++;d.hpNow=Math.max(0,d.hp-(P.dmg||0));d.wNow=Math.max(0,d.will-(P.wsp||0));d.pain=d.hpNow<=0?0:d.hpNow<=1&&d.hp>1?2:d.hpNow<=Math.floor(d.hp/2)?1:0;return d}
function bFx(fx){const b=B();if(!b)return;b.fxn=(b.fxn||0)+1;fx.n=b.fxn;(b.fxl=b.fxl||[]).push(fx);if(b.fxl.length>6)b.fxl.shift();if((S.opt.audioOut||'off')==='qui'&&AUD.has()){AUD.unlock();fxSound(fx)}}
function bLog(t){const b=B();b.log.unshift('R'+b.round+' · '+t);b.log.length=Math.min(b.log.length,40)}
function bHurt(f,n,why){const P=bP(f),d=bDer(f);P.dmg=clamp((P.dmg||0)+n,0,d.hp);if(n)bLog(bName(f)+(n>0?' subisce '+n+' dann'+(n===1?'o':'i'):' recupera '+(-n)+' HP')+(why?' ('+why+')':'')+(d.hp-P.dmg<=0?' ed è KO':''))}
function bOrder(){const b=B();return b.f.slice().sort((x,y)=>{const a=bDer(x),c=bDer(y);return (c.init+y.d6)-(a.init+x.d6)||c.init-a.init})}
function bSources(){return [['saved','Pokémon salvati']].concat(pgs().map(t=>[t.id,'Giocatore: '+(t.name||'Senza nome')+' ('+t.team.length+')']),S.trainers.filter(t=>!t.pg).map(t=>[t.id,(t.name||'Senza nome')+' ('+t.team.length+')']))}
function bSug(){const q=ui.bt.q;if(!q)return '';const r=monMatches(q,6);return r.length?`<div class="list">${r.map(i=>`<button class="item" data-a="bwild" data-i="${i}">${monAv(i,'sm')}<span class="dexn">${esc(MON[i].num||'—')}</span><span class="t grow">${esc(MON[i].n)}</span>${rtag(MON[i].rk)}</button>`).join('')}</div>`:'<p class="small muted">Nessun Pokémon con questo nome.</p>'}
function vBattle(){
  const b=B();if(b){b.f=b.f.filter(f=>bP(f))}
  const tavH=`<div class="card"><div class="row"><h3 class="grow">Schermo per i giocatori</h3>${S.tav&&S.tav.code?'<span class="vis on">Attivo</span>':''}</div><div class="row"><button class="btn grow" data-a="open" data-k="tav">${S.tav&&S.tav.code?'Gestisci':'Attiva'}</button><button class="btn grow" data-a="tavjoin">Usa come schermo per i giocatori</button></div></div>`;
  if(!b)return tavH+musH()+`<div class="card"><h2>Assistente di battaglia</h2><p class="muted">Prepara i due lati, tira l’iniziativa con i dadi veri e segui round, azioni, danni, stati e meteo. Pensato anche per le sfide 3 contro 3.</p><button class="btn pri" data-a="bnew">Nuova battaglia</button></div>`;
  const tb=`<div class="row"><button class="btn sm grow" data-a="open" data-k="tav">${S.tav&&S.tav.code?'Schermo giocatori: attivo · '+TAV.peersOpen()+' collegati':'Schermo per i giocatori'}</button></div>`;
  if(b.phase==='setup')return tb+bSetup()+musH();
  if(b.phase==='init')return tb+bInit();
  return tb+remindH()+bFight()+effH()+musH();
}
function bSetup(){
  const b=B(),t=ui.bt;const src=t.src==='saved'?S.saved:((S.trainers.find(x=>x.id===t.src)||{team:[]}).team);
  const sideH=(sd,lab)=>{const l=b.f.filter(x=>x.side===sd);return `<div class="card fc ${sd}"><h3>${lab} (${l.length})</h3>${l.length?`<div class="list">${l.map(f=>{const P=bP(f);return `<div class="item">${monAv(P.m,'sm')}<span class="grow"><span class="t">${esc(bName(f))}</span><br><span class="small muted">${esc(bOwner(f))} · ${RK[P.rk]}</span></span><button class="btn sm" data-a="brem" data-i="${f.id}">Togli</button></div>`}).join('')}</div>`:'<p class="small muted">Nessun Pokémon su questo lato.</p>'}</div>`};
  return `<div class="row"><h2 class="grow">Prepara la battaglia</h2><button class="btn sm danger" data-a="bend">Annulla</button></div>
  ${sideH('A','Lato giocatori')}${sideH('B','Lato avversari')}
  <div class="card"><h3>Aggiungi Pokémon</h3><div class="seg"><button data-a="bside" data-i="A" aria-pressed="${t.side==='A'}">Ai giocatori</button><button data-a="bside" data-i="B" aria-pressed="${t.side==='B'}">Agli avversari</button></div>
  ${selectH('bsrc','bsrc',t.src,bSources(),'Dal catalogo')}
  ${src.length?`<div class="seg">${src.map(P=>`<button data-a="badd" data-i="${P.id}" aria-pressed="${b.f.some(x=>x.o===t.src&&x.i===P.id)}"><i class="pip" style="--pc:${RKCOL[P.rk]}"></i>${esc(P.nick||MON[P.m].n)}</button>`).join('')}<button data-a="baddall">Tutti</button></div>`:'<p class="small muted">Nessun Pokémon qui.</p>'}
  <h3>Selvatico al volo</h3><div class="row"><div class="field"><label for="bq">Specie</label><input id="bq" type="search" data-i="bq" value="${esc(t.q)}" placeholder="Nome del Pokémon" autocomplete="off"></div>${selectH('bwr','bwr',t.rk,[[-1,'Rango suggerito']].concat(RK.map((r,i)=>[i,r])),'Rango')}</div><div id="bsug">${bSug()}</div>
  <button class="btn" data-a="bwildr">Selvatico casuale (filtri del generatore)</button></div>
  <button class="btn pri" data-a="binit"${b.f.length<2?' disabled':''}>Avanti: iniziativa</button>`;
}
function bInit(){
  const b=B();
  return `<h2>Iniziativa</h2><p class="small muted">Tira 1d6 vero per ogni Pokémon e tocca il risultato. Il totale è Dexterity + Alert + dado.</p>
  <div class="list">${b.f.map(f=>{const d=bDer(f);return `<div class="item fc ${f.side}" style="flex-wrap:wrap">${monAv(bP(f).m,'sm')}<span class="grow"><span class="t">${esc(bName(f))}</span><br><span class="small muted">${esc(bOwner(f))} · base ${d.init}${f.d6?' · totale '+(d.init+f.d6):''}</span></span><span class="n6">${[1,2,3,4,5,6].map(n=>`<button data-a="bd6" data-i="${f.id}" data-n="${n}" aria-pressed="${f.d6===n}">${n}</button>`).join('')}</span></div>`}).join('')}</div>
  <div class="row"><button class="btn" data-a="bback">Indietro</button><button class="btn pri grow" data-a="bstart"${b.f.some(f=>!f.d6)?' disabled':''}>Inizia la battaglia</button></div>`;
}
function bCard(f,cur){
  const P=bP(f);if(!P)return '';const M=MON[P.m],d=bDer(f),ko=d.hpNow<=0,open=ui.bt.open===f.id;
  const stl=f.st.map(k=>(STATI.find(x=>x[0]===k)||[])[1]);
  let h=`<div class="card fc ${f.side}${cur?' cur':''}${ko?' ko':''}"><div class="row">${monAv(bP(f).m)}<div class="grow"><span class="t">${esc(bName(f))}</span> <span class="small muted">${esc(bOwner(f))} · iniz. ${d.init+f.d6}</span></div>${M.ty.map(tchip).join('')}</div>
  <div class="hp"><b class="num">HP ${d.hpNow}/${d.hp}</b><div class="bar"><i style="width:${d.hp?100*d.hpNow/d.hp:0}%"></i></div>${stepper('bhp',f.id,'')}</div>

  if(fx.mv){AUD.move(fx.mv);await w(650);const h=fx.tg.filter(x=>x.k==='hit');if(h.length)AUD.hit(h.map(x=>x.e).find(e=>e)||0,fx.crit);if(fx.tg.some(x=>x.k==='eva'))AUD.se('gust');

  aapply(){const a=ui.act,f=bF(a.fid),o=bCalc(),mv=o.mv;
    if(!o.hit){bLog(bName(f)+' usa '+mv.n+' e manca')}
    else{if(!a.tg.length)bLog(bName(f)+' usa '+mv.n+(o.crit?' (critico)':''));
      a.tg.forEach(id=>{const T=bF(id),x=o.t[id],r=a.r[id];if(r.re&&T.acts<5){T.acts++;if(r.re==='cla'&&r.cm!=null)T.used.push(r.cm)}
        if(x.rok&&r.re==='eva')bLog(bName(f)+' usa '+mv.n+': '+bName(T)+' schiva');
        else if(x.rok&&r.re==='cla'){bLog(bName(f)+' usa '+mv.n+': Clash con '+bName(T)+' ('+x.cmv.n+')');bHurt(T,x.cd[0],'Clash');bHurt(f,x.cd[1],'Clash')}

        else{bLog(bName(f)+' usa '+mv.n+' su '+bName(T)+(o.crit?' (critico)':''));bHurt(T,x.final,mv.n)}})}
    {const FX={a:f.id,mv:{n:mv.n,t:mv.t,c:mv.c},miss:!o.hit,crit:!!o.crit,tg:[]};
      if(o.hit)a.tg.forEach(id=>{const T=bF(id),x=o.t[id],r=a.r[id];if(!T||!x)return;
        if(x.rok&&r.re==='eva')FX.tg.push({id,k:'eva'});else if(x.rok&&r.re==='cla')FX.tg.push({id,k:'cla',d:x.cd[0],d2:x.cd[1]});
        else if(o.support)FX.tg.push({id,k:'sup'});else FX.tg.push({id,k:'hit',d:x.final,e:x.eff===0?0:x.eff,ko:bDer(T).hpNow<=0,m:bP(T).m})});
      if(o.hit){const b=B(),wm=WMOVES[mv.n],dm=(mv.e||'').match(/Duration (\d+) Rounds?|lasts (\d+) rounds?/i),nr=dm?+(dm[1]||dm[2]):4;
        if(wm){b.weather=wm;b.wt=nr;bLog('Meteo: '+(METEO.find(x=>x[0]===wm)||[])[1]+' per '+nr+' round')}
        else if(dm){(b.ef=b.ef||[]).push({n:mv.n,r:nr,f:o.support&&a.tg.length===1?a.tg[0]:f.id});bLog(mv.n+': effetto per '+nr+' round')}}

    (async()=>{let n=0;for(const f of fs){try{const r=await shrink(f),id=uid();await IDB.put(id,r.blob);(e.img=e.img||[]).push({id,d:'',w:r.w,h:r.h});n++}catch(err){toast('Immagine non letta: '+err.message)}}
      e.u=Date.now();save();ui.imbusy=false;render(true);if(n)toast(n===1?'Immagine aggiunta':n+' immagini aggiunte')})()}
  else if(k.startsWith('isel:')){const c=curInst(),f=k.slice(5);c.P[f]=f==='rk'?+v:v;save();render(true)}
});
function start(){
  const th=(location.hash||'').match(/^#tavolo(?:=([a-z0-9]+))?$/);
  if(th){if(!S||!Array.isArray(S.trainers))S={trainers:[],saved:[],opt:{def:2},diary:[]};VIEW.start(th[1]||null);return}
  if(!S||!Array.isArray(S.trainers)){
    S={trainers:[],saved:[],opt:{def:2}};
    const gi=MON.findIndex(m=>m.n==='Geodude'),oi=MON.findIndex(m=>m.n==='Onix');
    const t=newTrainer();Object.assign(t,{spr:'LEADER_Roxanne',name:'Livia (esempio)',role:'Capopalestra di tipo Roccia',age:2,rk:2,at:[3,2,3,3],so:[3,2,1,1,2],notes:'Allenatrice di esempio: modificala o eliminala.'});
    Object.assign(t.sk,{Throw:2,Evasion:2,Alert:2,Athletic:3,Nature:2,Intimidate:2,Lore:1});
    if(gi>=0)t.team.push(generate(gi,2,'def'));if(oi>=0)t.team.push(generate(oi,2,'phy'));
    S.trainers.push(t);save();
  }
  S.opt=S.opt||{def:2};S.saved=S.saved||[];S.diary=S.diary||[];
  const h=(location.hash||'').slice(1);if(['genera','allenatori','lotta','diario','database','regole'].includes(h))ui.tab=h;
  if(!ui.gen.cur){const pi=MON.findIndex(m=>m.n==='Pikachu');if(pi>=0){ui.gen.mi=pi;ui.gen.cur=generate(pi,MON[pi].rk,'bal');ui.gen.batch=[ui.gen.cur]}}
  render();
  if(ghCfg().tok&&!ghCfg().ok)verifyKey(true);
  if(S.tav&&S.tav.code)TAV.host();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  if(/^#imp=/.test(location.hash)){ui.impt=location.hash;try{history.replaceState(null,'',location.pathname)}catch(e){}ui.tab='allenatori';ui.tv='pg';ui.stack=[{k:'imp'}];render();ACT.impread()}
}
window.addEventListener('hashchange',()=>{if(/^#imp=/.test(location.hash)){ui.impt=location.hash;try{history.replaceState(null,'',location.pathname)}catch(e){}ui.tab='allenatori';ui.tv='pg';ui.stack=[{k:'imp'}];render();ACT.impread();return}const h=(location.hash||'').slice(1);if(['genera','allenatori','lotta','diario','database','regole'].includes(h)&&h!==ui.tab){ui.tab=h;render()}});
start();
</script>
